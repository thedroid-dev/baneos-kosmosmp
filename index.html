<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEEFPACKS — Texture Packs Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #050507; color: #ffffff; font-family: system-ui, -apple-system, sans-serif; }
        .bg-card { background-color: #0f0f14; }
        .border-subtle { border-color: #22222d; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- HEADER -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-[#0a0a0f]/90 backdrop-blur-md border-b border-[#22222d]">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="#" class="flex items-center gap-3 font-black text-xl tracking-wider uppercase">
                <div class="w-9 h-9 bg-white text-black rounded-xl flex items-center justify-center font-extrabold text-lg">
                    <i class="fa-solid fa-cube"></i>
                </div>
                <span>KEEFPACKS</span>
            </a>
            <div class="text-xs font-bold text-gray-400">ADMIN: <span class="text-white">71x7</span></div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="pt-24 pb-16 px-4 max-w-7xl mx-auto w-full flex-grow">
        <!-- BUSCADOR -->
        <div class="text-center max-w-2xl mx-auto space-y-4 mb-10">
            <h1 class="text-3xl md:text-5xl font-black uppercase tracking-tight">
                BUSCADOR DE PACKS <span class="text-gray-500 block">KEEFPACKS</span>
            </h1>
            <form onsubmit="handleSearch(event)" class="relative max-w-xl mx-auto mt-6">
                <input type="text" id="searchInput" placeholder="Buscar packs reales (ej. PvP, Bedwars, 1.20)..." class="w-full bg-[#0f0f14] border border-[#22222d] rounded-2xl py-3.5 pl-12 pr-28 text-sm text-white focus:border-white transition outline-none">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-gray-500"></i>
                <button type="submit" class="absolute right-2 top-2 bottom-2 bg-white text-black font-extrabold px-4 rounded-xl text-xs uppercase hover:bg-gray-200 transition">
                    Buscar
                </button>
            </form>
        </div>

        <!-- CONTENEDOR DE PACKS REALES -->
        <div id="loading" class="text-center text-gray-500 font-bold py-10">Cargando paquetes de recursos...</div>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 hidden" id="packsGrid"></div>
    </main>

    <!-- FOOTER -->
    <footer class="border-t border-[#22222d] py-6 text-center text-xs text-gray-500 font-semibold">
        <p>KEEFPACKS © 2026 — Propiedad de <span class="text-white">71x7</span>. Descargas directas e ilimitadas.</p>
    </footer>

    <!-- LOGICA JAVASCRIPT REAL -->
    <script>
        async function fetchPacks(query = '') {
            const grid = document.getElementById('packsGrid');
            const loader = document.getElementById('loading');
            
            loader.classList.remove('hidden');
            grid.classList.add('hidden');
            grid.innerHTML = '';

            try {
                const res = await fetch(`/api/packs?q=${encodeURIComponent(query)}`);
                const data = await res.json();

                if (data.success && data.packs.length > 0) {
                    data.packs.forEach(pack => {
                        grid.innerHTML += `
                            <div class="bg-card border border-[#22222d] rounded-2xl p-3 flex flex-col justify-between hover:border-white transition">
                                <div class="relative aspect-video bg-gray-900 rounded-xl overflow-hidden mb-3">
                                    <img src="${pack.image}" class="w-full h-full object-cover">
                                    <span class="absolute top-2 right-2 bg-black/80 border border-[#22222d] text-[10px] font-bold px-2 py-0.5 rounded-md">${pack.resolution}</span>
                                </div>
                                <h3 class="font-bold text-sm truncate">${pack.title}</h3>
                                <div class="mt-4 pt-3 border-t border-[#22222d] flex items-center justify-between">
                                    <a href="${pack.downloadUrl}" class="w-full bg-white text-black text-center text-xs font-bold py-2 rounded-lg hover:bg-gray-200 transition uppercase">
                                        <i class="fa-solid fa-download mr-1"></i> Descargar Directo
                                    </a>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    grid.innerHTML = `<p class="col-span-full text-center text-gray-500">No se encontraron paquetes.</p>`;
                }
            } catch (err) {
                grid.innerHTML = `<p class="col-span-full text-center text-red-500">Error de conexión con la base de datos.</p>`;
            }

            loader.classList.add('hidden');
            grid.classList.remove('hidden');
        }

        function handleSearch(e) {
            e.preventDefault();
            const q = document.getElementById('searchInput').value;
            fetchPacks(q);
        }

        // Cargar packs al entrar
        fetchPacks();
    </script>
</body>
</html>
